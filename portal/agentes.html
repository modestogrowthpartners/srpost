<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sr. Post | Central de agentes</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: central de agentes do time. Uma coluna; um cartao por agente; as telas trocam pelo hash da URL.
   Mesma identidade do painel (admin.html) e do portal. */
:root {
  color-scheme: light;
  --bg: #F4F7FA; --soft: #E4E9EF; --card: #FFFFFF; --ink: #0B0F14; --muted: #4E5B6B; --line: #B5C0CD;
  --blue: #668EC2; --sky: #DCE6F2; --butter: #FFA070; --butter-soft: #FFE3D3; --approve: #13243B;
  --error: #B3361F; --error-soft: #F7DDD6;
  --display: "Chakra Petch", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 0.9rem; line-height: 1.5; overflow-wrap: break-word; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img, video { max-width: 100%; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
legend { padding: 0; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1180px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { border-bottom: 1.5px solid var(--ink); background: var(--bg); position: sticky; top: 0; z-index: 10; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; min-height: 54px; padding-block: 8px; }
.top b { font-family: var(--display); font-size: 1.15rem; }
.top nav { display: flex; flex-wrap: wrap; gap: 6px; }
.top nav .btn[aria-current="page"] { background: var(--ink); color: #FFF; }
.sub { font-size: 0.8rem; font-family: var(--body); font-weight: 400; }
main { padding-block: 24px 64px; display: grid; gap: 18px; }
.label { font-family: var(--display); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.hint { font-size: 0.78rem; color: var(--muted); }
.hint.bad { color: var(--error); font-weight: 700; }
.panel { display: grid; gap: 14px; padding: 18px; border: 1.5px solid var(--ink); border-radius: 16px; background: var(--card); min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 999px; background: var(--ink); color: #FFF; font-weight: 700; font-size: 0.85rem; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--approve); }
.btn.ghost { background: var(--card); color: var(--ink); }
.btn.ghost:hover { background: var(--soft); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 0.78rem; }
.btn.danger { background: var(--card); color: var(--error); border-color: var(--error); }
.btn.danger:hover { background: var(--error-soft); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.5; cursor: default; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.f { display: grid; gap: 4px; min-width: 0; align-content: start; }
.f.wide { grid-column: 1 / -1; }
input[type=text], input[type=password], input[type=number], input[type=url], textarea, select { width: 100%; min-height: 40px; padding: 8px 12px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--bg); }
textarea { min-height: 76px; resize: vertical; }
input:disabled, textarea:disabled, select:disabled { opacity: 0.5; }
[aria-invalid="true"] { border-color: var(--error) !important; background: var(--error-soft) !important; }
.pill { display: inline-flex; align-items: center; min-height: 22px; max-width: 100%; padding: 0 9px; border: 1.5px solid var(--ink); border-radius: 999px; font-family: var(--display); font-weight: 600; font-size: 0.72rem; background: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.ok { background: var(--approve); color: #FFF; } .pill.wait { background: var(--sky); } .pill.fix { background: var(--butter); } .pill.demo { background: var(--butter-soft); }
.pill.no { background: var(--error-soft); color: var(--error); border-color: var(--error); }
.rows { display: grid; gap: 8px; }
.side { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
code, .mono { font-family: var(--body); font-size: 0.8rem; padding: 6px 10px; border-radius: 8px; background: var(--soft); overflow-wrap: anywhere; display: block; user-select: all; }
.notice { padding: 10px 14px; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--sky); font-size: 0.85rem; overflow-wrap: anywhere; }
.notice.warn { background: var(--butter-soft); } .notice.bad { background: var(--error-soft); border-color: var(--error); }
.note { padding: 6px 10px; border-left: 3px solid var(--butter); background: var(--bg); font-size: 0.82rem; overflow-wrap: anywhere; }
.check { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.check input { width: 18px; height: 18px; flex: none; margin: 2px 0 0; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.gate { min-height: 70vh; display: grid; place-content: center; gap: 12px; justify-items: center; text-align: center; }
.gate form { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(100%, 460px); }
.gate input { flex: 1 1 240px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: #FFF; font-size: 0.85rem; z-index: 30; }
#toast.bad { background: var(--error); }

/* Central */
.cards { display: grid; gap: 14px; }
.agent h2 a { text-decoration: none; }
.agent h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.cols { display: grid; gap: 14px 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.col { display: grid; gap: 6px; align-content: start; min-width: 0; }
.items { display: grid; gap: 6px; min-width: 0; }
.item { display: grid; gap: 4px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 0.82rem; overflow-wrap: anywhere; min-width: 0; text-decoration: none; }
a.item:hover { background: var(--sky); border-color: var(--ink); }
.item.err { border-color: var(--error); background: var(--error-soft); }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; color: var(--muted); font-size: 0.76rem; }
.item.err .meta { color: var(--ink); }
.track { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
.track i { height: 6px; border-radius: 3px; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); }
.track i.done { background: var(--ink); box-shadow: none; }
.track i.now { background: var(--butter); box-shadow: inset 0 0 0 1.5px var(--ink); }
.track i.bad { background: var(--error); box-shadow: none; }
.switch { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0; border: 0; background: none; font-weight: 700; font-size: 0.8rem; text-align: left; }
.switch i { position: relative; flex: none; width: 44px; height: 24px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--soft); transition: background 0.15s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: var(--ink); transition: transform 0.15s; }
.switch[aria-checked="true"] i { background: var(--butter); }
.switch[aria-checked="true"] i::after { transform: translateX(20px); }
.switch[aria-disabled="true"] { opacity: 0.5; cursor: default; }
.bulkrow { display: grid; gap: 6px 16px; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); padding: 10px 0; border-top: 1.5px solid var(--soft); align-items: start; }
.bulkctl { display: grid; gap: 4px; min-width: 0; }
.bulkctl.off { opacity: 0.55; }

/* Chips (temas e horarios) */
.chipbox { display: grid; gap: 6px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 2px; min-height: 30px; max-width: 100%; padding: 0 4px 0 10px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--sky); font-size: 0.8rem; overflow-wrap: anywhere; }
.chip button { flex: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: none; font-weight: 700; line-height: 1; }
.chip button:hover { background: var(--card); }
.chipadd { display: flex; gap: 6px; min-width: 0; }
.chipadd input { flex: 1 1 auto; min-width: 0; }

/* Assistente */
.steps { display: flex; flex-wrap: wrap; gap: 6px; }
.steps button { min-height: 32px; padding: 0 12px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--card); font-family: var(--display); font-weight: 600; font-size: 0.78rem; }
.steps button[aria-current="step"] { background: var(--ink); color: #FFF; }
.steps button:disabled { border-color: var(--line); color: var(--muted); cursor: default; }
.grp { display: grid; gap: 12px; padding-top: 14px; border-top: 1.5px solid var(--soft); }
.grp > legend { font-family: var(--display); font-weight: 700; font-size: 1rem; float: left; width: 100%; }
.radio { display: grid; gap: 8px; }
.radio .check { padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); }
.radio .check:has(input:checked) { border-color: var(--ink); background: var(--sky); }
.radio .check:has(input:disabled) { opacity: 0.6; }
.review { display: grid; gap: 10px; }
.review .item b { font-family: var(--display); }
.kvl { display: grid; gap: 2px; min-width: 0; }

/* Agente: execucoes */
.run { border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; }
.run.open { border-color: var(--ink); background: var(--card); }
.run > button { width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 12px 14px; border: 0; border-radius: 12px; background: none; text-align: left; }
.run > button:hover { background: var(--sky); }
.run .main { display: grid; gap: 2px; min-width: 0; flex: 1 1 240px; overflow-wrap: anywhere; }
.run .body { display: grid; gap: 16px; padding: 6px 14px 14px; min-width: 0; }
.sec { display: grid; gap: 6px; min-width: 0; }
.sec.part { padding-top: 14px; border-top: 1.5px solid var(--soft); }
.tl { display: grid; margin-left: 5px; padding-left: 16px; border-left: 2px solid var(--line); }
.tl li { position: relative; display: grid; gap: 2px; padding: 6px 0; font-size: 0.82rem; overflow-wrap: anywhere; min-width: 0; }
.tl li::before { content: ""; position: absolute; left: -23px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink); }
.tl li.ok::before { background: var(--ink); }
.tl li.falhou::before { background: var(--error); border-color: var(--error); }
.tl li.aguardando::before { background: var(--butter); }
.tl li.iniciou::before { background: var(--sky); }
.tl .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 0.76rem; color: var(--muted); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs a { display: block; width: 72px; aspect-ratio: 4 / 5; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--ink); }
.thumbs img, .thumbs video { width: 100%; height: 100%; object-fit: cover; display: block; }
.upl { display: grid; gap: 10px; padding: 12px; border: 1.5px dashed var(--ink); border-radius: 12px; background: var(--butter-soft); min-width: 0; }
.upl input[type=file] { max-width: 100%; }
details > summary { cursor: pointer; font-weight: 700; font-size: 0.82rem; }
pre.json { margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--soft); font-family: var(--body); font-size: 0.76rem; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Chat */
.thread { display: grid; gap: 10px; min-width: 0; }
.msg { display: grid; gap: 8px; padding: 12px 14px; border: 1.5px solid var(--ink); border-radius: 14px; background: var(--card); min-width: 0; overflow-wrap: anywhere; }
.msg.me { justify-self: end; max-width: min(100%, 680px); background: var(--ink); color: #FFF; }
.msg.bad { background: var(--error-soft); border-color: var(--error); }
.logs { display: grid; gap: 4px; font-size: 0.78rem; }
.log { display: grid; gap: 2px 10px; grid-template-columns: 120px minmax(0, 150px) minmax(0, 120px) minmax(0, 90px) minmax(0, 1fr); padding: 6px 8px; border-radius: 8px; background: var(--soft); min-width: 0; }
.log.falhou { background: var(--error-soft); }
.ask { display: grid; gap: 8px; }
.ask .line { display: flex; gap: 8px; align-items: flex-end; }
.ask textarea { min-height: 44px; flex: 1 1 auto; min-width: 0; }

@media (max-width: 760px) {
  .top { position: static; }
  .bulkrow { grid-template-columns: minmax(0, 1fr); }
  .log { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .log .m { grid-column: 1 / -1; }
  .ask .line { flex-wrap: wrap; }
  .ask .line .btn { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <b>Sr. Post <span class="sub muted">central de agentes</span></b>
  <nav id="navbar" hidden aria-label="Telas da central">
    <a class="btn ghost sm" href="#central" data-v="central">Central</a>
    <a class="btn ghost sm" href="#novo" data-v="novo">Novo agente</a>
    <a class="btn ghost sm" href="#vivo" data-v="vivo">Ao vivo</a>
    <a class="btn ghost sm" href="#chat" data-v="chat">Chat</a>
    <a class="btn ghost sm" href="admin.html">Clientes</a>
    <button class="btn ghost sm" type="button" id="navOut">Sair</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script src="agentes-live.js"></script>
<script>
(function () {
  "use strict";
  var API = (window.SRPOST && window.SRPOST.api) || "", STORE = "srpost.admin.key", KEY = "";
  var app = document.getElementById("app"), navbar = document.getElementById("navbar");
  var MAX_BYTES = 50 * 1024 * 1024;
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var LINK = /^https?:\/\/[^\s]+\.[^\s]+$/i;
  var CENTRAL_AT = 0;
  var CENTRAL = null;   // ultima resposta de GET /admin/agents (motor + agentes), reaproveitada entre as telas
  var RUN_CLIENT = {};  // execucao -> cliente, aprendido nas respostas do ao vivo (para abrir a execucao no agente certo)
  var WZ = null;        // rascunho do assistente: sobrevive a troca de tela, some ao sair ou recarregar
  var CHAT = { msgs: [], busy: false, since: 0 };
  var view = null, uid = 0;

  var STEPS = ["planejar", "roteiro", "copy", "midia", "aprovacao", "publicar"];
  var STEP = { planejar: "Planejar", roteiro: "Roteiro", copy: "Copy", midia: "Gerar mídia", aprovacao: "Fila de aprovação", publicar: "Publicar", config: "Configuração" };
  var NET = { instagram: "Instagram", tiktok: "TikTok" };
  var FMT = { reel: "Reel", carrossel: "Carrossel", imagem: "Imagem", story: "Story" };
  var FMT_OPTS = [["reel", "Reel (vídeo vertical)"], ["carrossel", "Carrossel (2 a 10 imagens)"], ["imagem", "Imagem (post único)"], ["story", "Story"]];
  var NET_OPTS = [["instagram", "Instagram"], ["tiktok", "TikTok"]];
  var RUN_STATUS = { rodando: ["Rodando", "wait"], aguardando_midia: ["Aguardando mídia", "fix"], aguardando_aprovacao: ["Aguardando aprovação", "wait"], publicando: ["Publicando", "wait"], concluido: ["Concluído", "ok"], falhou: ["Falhou", "no"], cancelado: ["Cancelado", ""] };
  var ACTIVE = ["rodando", "aguardando_midia", "aguardando_aprovacao", "publicando"];
  var EV_STATUS = { iniciou: "iniciou", ok: "concluiu", falhou: "falhou", aguardando: "aguardando", info: "registro", pulou: "pulou" };
  var AGENT_STATUS = { ativo: ["Agente ativo", "ok"], pausado: ["Agente pausado", ""], configurando: ["Em configuração", "fix"] };
  var VOICE = ["usa", "evita", "cta", "provas", "proibido", "emoji"];
  var TZ_OPTS = [["America/Sao_Paulo", "Brasília (São Paulo, Rio, Sul, Nordeste em geral)"], ["America/Manaus", "Manaus (1 hora a menos que Brasília)"], ["America/Cuiaba", "Cuiabá e Campo Grande (1 hora a menos)"],
    ["America/Rio_Branco", "Rio Branco (2 horas a menos)"], ["America/Noronha", "Fernando de Noronha (1 hora a mais)"]];
  var TITLES = { central: "Central de agentes", novo: "Novo agente", vivo: "Ao vivo", chat: "Chat de diagnóstico", agente: "Agente" };

  // ---------- utilitarios ----------
  function el(tag, attrs) {
    var n = document.createElement(tag), i, k;
    if (attrs) for (k in attrs) {
      if (attrs[k] == null || attrs[k] === false) continue;
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else if (k in n && k !== "list") { try { n[k] = attrs[k]; } catch (e) { n.setAttribute(k, attrs[k]); } }
      else n.setAttribute(k, attrs[k]);
    }
    for (i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null || c === false) continue; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return n;
  }
  function toast(msg, bad) {
    var t = document.getElementById("toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, bad ? 8000 : 4000);
  }
  // ms (opcional) limita a espera: o chat pode levar ate 2 minutos, o resto usa o tempo padrao do navegador.
  function api(method, path, body, ms) {
    var ctl = ms && window.AbortController ? new AbortController() : null, timer = ctl ? setTimeout(function () { ctl.abort(); }, ms) : 0;
    return fetch((window.SRPOST.base ? window.SRPOST.base(path) : API) + path, { method: method, headers: { "x-admin-key": KEY, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined, signal: ctl ? ctl.signal : undefined })
      .then(function (r) { clearTimeout(timer); return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.message || "Erro " + r.status + "."); e.status = r.status; e.code = j.error; throw e; } return j; }); },
        function (err) { clearTimeout(timer); throw new Error(err && err.name === "AbortError" ? "A API não respondeu a tempo. Tente de novo." : "Sem conexão com a API."); });
  }
  function fail(e) { if (e.status === 401) logout("Esta chave não é mais aceita. Entre de novo."); else toast(e.message, true); }
  function nid() { return "f" + (++uid); }
  // Botao com pedido em andamento: fica marcado como ocupado, mas continua focavel (disabled derruba o foco do teclado).
  function hold(b, on) { if (on) b.setAttribute("aria-disabled", "true"); else b.removeAttribute("aria-disabled"); }
  function held(b) { return b.getAttribute("aria-disabled") === "true"; }
  function pill(text, cls) { return el("span", { class: "pill" + (cls ? " " + cls : ""), text: text }); }
  function note(text, kind) { return el("div", { class: "notice" + (kind ? " " + kind : ""), text: text }); }
  function errorBox(msg, retry) {
    return el("div", { class: "notice bad", role: "alert" }, el("p", { text: msg }), retry ? el("p", { style: "margin-top:8px" }, el("button", { class: "btn sm", type: "button", text: "Tentar de novo", onclick: retry })) : null);
  }
  // Campo com rotulo, dica e mensagem de erro ligados ao controle (aria-describedby).
  function field(label, input, o) {
    o = o || {}; var id = input.id || (input.id = nid());
    var hint = o.hint ? el("span", { class: "hint", id: id + "h", text: o.hint }) : null, err = el("span", { class: "hint bad", id: id + "e", hidden: true });
    input.setAttribute("aria-describedby", (hint ? id + "h " : "") + id + "e"); input._err = err;
    return el("div", { class: "f" + (o.wide ? " wide" : "") }, el("label", { class: "label", htmlFor: id, text: label }), input, hint, err);
  }
  // Grupo de controles (caixas de marcar, chips) com um rotulo so.
