<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sr. Post | Painel do time</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: painel de trabalho em coluna, lista de clientes -> detalhe do cliente. Mesma identidade do portal. */
:root {
  color-scheme: light;
  --bg: #F4F7FA; --soft: #E4E9EF; --card: #FFFFFF; --ink: #0B0F14; --muted: #4E5B6B; --line: #B5C0CD;
  --blue: #668EC2; --sky: #DCE6F2; --butter: #FFA070; --butter-soft: #FFE3D3; --approve: #13243B;
  --error: #B3361F; --error-soft: #F7DDD6;
  --display: "Chakra Petch", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 0.9rem; line-height: 1.5; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
ul { margin: 0; padding: 0; list-style: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1080px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { border-bottom: 1.5px solid var(--ink); background: var(--bg); position: sticky; top: 0; z-index: 10; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; min-height: 54px; padding-block: 8px; }
.top b { font-family: var(--display); font-size: 1.15rem; }
.top nav { display: flex; flex-wrap: wrap; gap: 6px; }
main { padding-block: 24px 64px; display: grid; gap: 18px; }
.label { font-family: var(--display); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.panel { display: grid; gap: 14px; padding: 18px; border: 1.5px solid var(--ink); border-radius: 16px; background: var(--card); min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 999px; background: var(--ink); color: #FFF; font-weight: 700; font-size: 0.85rem; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--approve); }
.btn.ghost { background: var(--card); color: var(--ink); }
.btn.ghost:hover { background: var(--soft); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 0.78rem; }
.btn.danger { background: var(--card); color: var(--error); border-color: var(--error); }
.btn.danger:hover { background: var(--error-soft); }
.btn:disabled { opacity: 0.5; cursor: default; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.f { display: grid; gap: 4px; min-width: 0; }
.f.wide { grid-column: 1 / -1; }
input[type=text], input[type=password], input[type=number], input[type=datetime-local], textarea, select { width: 100%; min-height: 40px; padding: 8px 12px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--bg); }
textarea { min-height: 72px; resize: vertical; }
.pill { display: inline-flex; align-items: center; min-height: 22px; padding: 0 9px; border: 1.5px solid var(--ink); border-radius: 999px; font-family: var(--display); font-weight: 600; font-size: 0.72rem; background: var(--soft); white-space: nowrap; }
.pill.ok { background: var(--approve); color: #FFF; } .pill.wait { background: var(--sky); } .pill.fix { background: var(--butter); }
.pill.no { background: var(--error-soft); color: var(--error); border-color: var(--error); }
.rows { display: grid; gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; }
button.row { width: 100%; text-align: left; border-color: var(--ink); background: var(--card); }
button.row:hover { background: var(--sky); }
.row .main { display: grid; gap: 2px; min-width: 0; flex: 1 1 240px; overflow-wrap: anywhere; }
.row .side { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.kv { display: grid; gap: 6px; }
.kv div { display: grid; gap: 2px; }
code, .mono { font-family: var(--body); font-size: 0.8rem; padding: 6px 10px; border-radius: 8px; background: var(--soft); overflow-wrap: anywhere; display: block; user-select: all; }
.notice { padding: 10px 14px; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--sky); font-size: 0.85rem; overflow-wrap: anywhere; }
.notice.warn { background: var(--butter-soft); } .notice.bad { background: var(--error-soft); border-color: var(--error); }
.creative { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); }
.creative .thumb { width: 64px; aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; background: var(--ink); }
.creative .thumb img, .creative .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.creative .body { display: grid; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.creative .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.78rem; color: var(--muted); }
.note { padding: 6px 10px; border-left: 3px solid var(--butter); background: var(--card); font-size: 0.82rem; }
.upl { display: grid; gap: 10px; padding: 12px; border: 1.5px dashed var(--line); border-radius: 12px; }
.check { display: flex; align-items: center; gap: 8px; }
.check input { width: 18px; height: 18px; }
.gate { min-height: 70vh; display: grid; place-content: center; gap: 12px; justify-items: center; text-align: center; }
.gate form { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(100%, 460px); }
.gate input { flex: 1 1 240px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: #FFF; font-size: 0.85rem; z-index: 30; }
#toast.bad { background: var(--error); }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <b>Sr. Post <span class="muted" style="font-size:0.8rem;font-family:var(--body);font-weight:400">painel do time</span></b>
  <nav id="navbar" hidden>
    <button class="btn ghost sm" type="button" id="navClients">Clientes</button>
    <button class="btn ghost sm" type="button" id="navConfig">Configuração</button>
    <button class="btn ghost sm" type="button" id="navOut">Sair</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var API = (window.SRPOST && window.SRPOST.api) || "", STORE = "srpost.admin.key", KEY = "";
  var app = document.getElementById("app");
  var MAX_BYTES = 50 * 1024 * 1024;

  function el(tag, attrs) {
    var n = document.createElement(tag), i, k;
    if (attrs) for (k in attrs) {
      if (attrs[k] == null || attrs[k] === false) continue;
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else if (k in n && k !== "list") { try { n[k] = attrs[k]; } catch (e) { n.setAttribute(k, attrs[k]); } }
      else n.setAttribute(k, attrs[k]);
    }
    for (i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null || c === false) continue; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return n;
  }
  function toast(msg, bad) {
    var t = document.getElementById("toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, bad ? 8000 : 4000);
  }
  function api(method, path, body) {
    return fetch(API + path, { method: method, headers: { "x-admin-key": KEY, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.message || "Erro " + r.status); e.status = r.status; throw e; } return j; }); },
        function () { throw new Error("Sem conexão com a API."); });
  }
  function fail(e) { if (e.status === 401) { logout(); } toast(e.message, true); }
  function date(iso) { return iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : ""; }
  function n(v) { return v == null ? "0" : new Intl.NumberFormat("pt-BR").format(v); }
  function field(label, input, wide) { return el("label", { class: "f" + (wide ? " wide" : "") }, el("span", { class: "label", text: label }), input); }
  function copyBtn(text) {
    return el("button", { class: "btn ghost sm", type: "button", text: "Copiar", onclick: function (ev) {
      var b = ev.currentTarget;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { b.textContent = "Copiado"; setTimeout(function () { b.textContent = "Copiar"; }, 1500); },
        function () { toast("Selecione o texto e copie manualmente.", true); });
    } });
  }
  var FORMAT = { reel: "Reel", feed: "Feed", story: "Story" };
  var NET = { instagram: "Instagram", tiktok: "TikTok" };
  function kindLabel(c) { return c.kind === "carousel" ? "Carrossel (" + ((c.media || []).length) + ")" : (FORMAT[c.format] || c.format); }
  function netChecks(selected) {
    var boxes = {}, wrap = el("div", { style: "display:flex;flex-wrap:wrap;gap:6px 16px" });
    ["instagram", "tiktok"].forEach(function (p) {
      boxes[p] = el("input", { type: "checkbox", checked: (selected || ["instagram"]).indexOf(p) >= 0 });
      wrap.appendChild(el("label", { class: "check" }, boxes[p], NET[p]));
    });
    return { node: wrap, value: function () { return ["instagram", "tiktok"].filter(function (p) { return boxes[p].checked; }); } };
  }
  function accountPills(list) {
    var out = [];
    ["instagram", "tiktok"].forEach(function (p) {
      var a = (list || []).filter(function (x) { return x.platform === p; })[0];
      out.push(el("span", { class: "pill" + (a && a.status === "connected" ? " ok" : a ? " no" : ""), text: a && a.status === "connected" ? NET[p] + ": @" + (a.username || "conta") : a ? NET[p] + " expirado" : "Sem " + NET[p] }));
    });
    return out;
  }

  // ---------- acesso ----------
  function logout() { KEY = ""; try { localStorage.removeItem(STORE); } catch (e) {} document.getElementById("navbar").hidden = true; gate(); }
  function gate(msg) {
    app.textContent = "";
    var input = el("input", { type: "password", id: "adminKey", placeholder: "srp_adm_...", autocomplete: "off", "aria-label": "Chave do painel" });
    app.appendChild(el("section", { class: "gate" }, el("h1", { text: "Painel do time" }),
      el("p", { class: "muted", text: msg || "Entre com a sua chave de acesso do painel." }),
      el("form", { onsubmit: function (ev) { ev.preventDefault(); KEY = input.value.trim(); if (KEY.length < 20) return; enter(); } }, input, el("button", { class: "btn", type: "submit", text: "Entrar" }))));
  }
  function enter() {
    api("GET", "/admin/overview").then(function (o) {
      try { localStorage.setItem(STORE, KEY); } catch (e) {}
      document.getElementById("navbar").hidden = false; renderClients(o);
    }).catch(function (e) { KEY = ""; gate(e.status === 401 ? "Chave inválida. Confira e tente de novo." : e.message); });
  }
  document.getElementById("navOut").addEventListener("click", logout);
  document.getElementById("navClients").addEventListener("click", function () { loadClients(); });
  document.getElementById("navConfig").addEventListener("click", function () { loadConfig(); });

  // ---------- clientes ----------
  function loadClients() { api("GET", "/admin/overview").then(renderClients).catch(fail); }
  function agentFields(a) {
    a = a || {};
    var f = {
      name: el("input", { type: "text", value: a.name || "", placeholder: "Ex.: Aurora" }),
      role_line: el("input", { type: "text", value: a.role_line || "", placeholder: "Agente de conteúdo da marca" }),
      bio: el("textarea", { value: a.bio || "", placeholder: "O que o agente faz por este cliente." }),
      tone: el("textarea", { value: a.tone || "", placeholder: "Tom de voz combinado." }),
      pillars: el("input", { type: "text", value: (a.pillars || []).join(", "), placeholder: "Dicas, Bastidores, Promoções" }),
      post_times: el("input", { type: "text", value: (a.post_times || ["12:00", "18:30"]).join(", "), placeholder: "12:00, 18:30" }),
      posts_per_week: el("input", { type: "number", min: "1", max: "28", value: String(a.posts_per_week || 7) }),
      status: el("select", null, el("option", { value: "ativo", text: "Ativo" }), el("option", { value: "configurando", text: "Em configuração" }), el("option", { value: "pausado", text: "Pausado" }))
    };
    var nets = netChecks(a.platforms);
    f.status.value = a.status || "ativo";
    var nodes = [field("Nome do agente", f.name), field("Descrição curta", f.role_line), field("Posts por semana", f.posts_per_week), field("Status", f.status),
      field("Horários de publicação (HH:MM, separados por vírgula)", f.post_times), field("Temas (separados por vírgula)", f.pillars),
      el("div", { class: "f" }, el("span", { class: "label", text: "Redes onde publica (padrão dos criativos)" }), nets.node),
      field("O que o agente faz", f.bio, true), field("Tom de voz", f.tone, true)];
    return { nodes: nodes, value: function () {
      var split = function (v) { return v.split(",").map(function (s) { return s.trim(); }).filter(Boolean); };
      return { name: f.name.value, role_line: f.role_line.value, bio: f.bio.value, tone: f.tone.value, pillars: split(f.pillars.value),
        post_times: split(f.post_times.value), posts_per_week: Number(f.posts_per_week.value) || 7, status: f.status.value, platforms: nets.value() };
    } };
  }
  function renderClients(o) {
    app.textContent = "";
    if (!o.config.ig_configured) app.appendChild(el("div", { class: "notice warn" }, "A conexão com o Instagram ainda não está configurada: falta cadastrar IG_APP_ID e IG_APP_SECRET. Veja em Configuração. Os clientes já podem aprovar; os posts ficam agendados."));
    if (o.config.tiktok_configured === false) app.appendChild(el("div", { class: "notice warn" }, "A conexão com o TikTok ainda não está ativa: falta cadastrar UPLOAD_POST_API_KEY. Veja em Configuração. Os posts de TikTok aprovados ficam agendados até lá."));
    var list = el("div", { class: "rows" });
    if (!o.clients.length) list.appendChild(el("p", { class: "muted", text: "Nenhum cliente ainda. Cadastre o primeiro abaixo." }));
    o.clients.forEach(function (c) {
      var k = c.counts || {};
      list.appendChild(el("button", { class: "row", type: "button", onclick: function () { loadClient(c.id); } },
        el("span", { class: "main" }, el("b", { text: c.name + (c.is_demo ? " (demonstração)" : "") }), el("span", { class: "muted", text: (c.segment || "Sem segmento") + " · " + c.slug })),
        el("span", { class: "side" },
          el("span", { class: "pill wait", text: (k.pending || 0) + " na fila" }),
          k.adjust ? el("span", { class: "pill fix", text: k.adjust + " em ajuste" }) : null,
          el("span", { class: "pill", text: (k.post_scheduled || 0) + " agendados" }),
          el("span", { class: "pill ok", text: (k.post_published || 0) + " publicados" }),
          k.post_failed ? el("span", { class: "pill no", text: k.post_failed + " com falha" }) : null)));
      var row = list.lastChild.querySelector(".side");
      accountPills(c.accounts || (c.instagram ? [Object.assign({ platform: "instagram" }, c.instagram)] : [])).forEach(function (x) { row.appendChild(x); });
    });
    app.appendChild(el("section", { class: "panel" }, el("div", { class: "head" }, el("h1", { text: "Clientes" })), list));

    var name = el("input", { type: "text", placeholder: "Nome do cliente" }), seg = el("input", { type: "text", placeholder: "Ex.: Clínica de estética" });
    var af = agentFields();
    var g = el("div", { class: "grid" }, field("Cliente", name), field("Segmento", seg)); af.nodes.forEach(function (x) { g.appendChild(x); });
    app.appendChild(el("section", { class: "panel" }, el("h2", { text: "Novo cliente" }), g,
      el("div", null, el("button", { class: "btn", type: "button", text: "Cadastrar cliente", onclick: function (ev) {
        var b = ev.currentTarget; b.disabled = true;
        api("POST", "/admin/clients", { name: name.value, segment: seg.value, agent: af.value() }).then(function (r) { toast("Cliente cadastrado."); loadClient(r.client.id); })
          .catch(function (e) { b.disabled = false; fail(e); });
      } }))));
  }

  // ---------- detalhe do cliente ----------
  function loadClient(id) { api("GET", "/admin/clients/" + id).then(function (d) { renderClient(d); window.scrollTo(0, 0); }).catch(fail); }
  function statusPill(c) {
    if (c.status === "pending") return el("span", { class: "pill wait", text: "Na fila do cliente" });
    if (c.status === "adjust") return el("span", { class: "pill fix", text: "Cliente pediu ajuste" });
    if (c.status === "rejected") return el("span", { class: "pill no", text: "Reprovado" });
    if (c.status === "replaced") return el("span", { class: "pill", text: "Substituído" });
    return el("span", { class: "pill ok", text: "Aprovado" });
  }
  function postLine(p) {
    var st = p.status === "published" ? ["Publicado " + date(p.published_at), "pill ok"] : p.status === "failed" ? ["Falhou", "pill no"]
      : p.status === "processing" ? ["Publicando", "pill wait"] : ["Agendado " + date(p.scheduled_for), "pill"];
    var m = p.metrics;
    return el("div", { class: "meta" }, el("b", { style: "color:var(--ink)", text: NET[p.platform] || p.platform }), el("span", { class: st[1], text: st[0] }),
      p.permalink ? el("a", { href: p.permalink, target: "_blank", rel: "noopener", text: "abrir" }) : null,
      m ? el("span", { text: n(m.views) + " views · " + n(m.likes) + " curtidas · " + n(m.comments) + " coment. · " + n(m.shares) + " compart." }) : null,
      p.last_error ? el("span", { style: "color:var(--error)", text: p.last_error }) : null,
      p.status === "failed" ? el("button", { class: "btn sm", type: "button", text: "Tentar de novo", onclick: function () { api("POST", "/admin/posts/" + p.id + "/retry").then(function () { toast("Reenviado."); loadClient(currentClient); }).catch(fail); } }) : null);
  }
  var currentClient = null;
  function renderClient(d) {
    var c = d.client, id = c.id; app.textContent = ""; currentClient = id;
    var accts = c.accounts || (c.instagram ? [Object.assign({ platform: "instagram" }, c.instagram)] : []);
    var agentNets = (c.agent && c.agent.platforms) || ["instagram"];
    var headPills = el("span", { class: "side" }); accountPills(accts).forEach(function (x) { headPills.appendChild(x); });
    app.appendChild(el("div", { class: "head" }, el("h1", { text: c.name }), headPills));

    // link de acesso
    var linkOut = el("div", { class: "kv" });
    var links = el("div", { class: "rows" });
    d.links.forEach(function (l) {
      links.appendChild(el("div", { class: "row" },
        el("span", { class: "main" }, el("b", { text: l.label || "Link sem nome" }), el("span", { class: "muted", text: "Criado " + date(l.created_at) + (l.last_used_at ? " · último acesso " + date(l.last_used_at) : " · nunca usado") + (l.expires_at ? " · expira " + date(l.expires_at) : "") })),
        el("span", { class: "side" }, l.revoked_at ? el("span", { class: "pill no", text: "Revogado" })
          : el("button", { class: "btn danger sm", type: "button", text: "Revogar", onclick: function () { api("POST", "/admin/links/" + l.id + "/revoke").then(function () { toast("Link revogado."); loadClient(id); }).catch(fail); } }))));
    });
    var label = el("input", { type: "text", placeholder: "Ex.: Celular da Marina" });
    app.appendChild(el("section", { class: "panel" }, el("h2", { text: "Link de acesso do cliente" }),
      el("p", { class: "muted", text: "Cada link abre o portal direto, sem senha. O endereço completo só aparece uma vez, na hora em que é gerado: copie e envie ao cliente." }),
      el("div", { class: "grid" }, field("Identificação do link", label),
        el("div", { class: "f", style: "align-content:end;justify-items:start" }, el("button", { class: "btn", type: "button", text: "Gerar link", onclick: function () {
          api("POST", "/admin/clients/" + id + "/links", { label: label.value }).then(function (r) {
            linkOut.textContent = ""; linkOut.appendChild(el("div", { class: "notice" }, el("span", { class: "label", text: "Link gerado (copie agora)" }), el("code", { text: r.url }), copyBtn(r.url)));
          }).catch(fail);
        } }))), linkOut, links));

    // upload
    var files = el("input", { type: "file", multiple: true, accept: "video/mp4,video/quicktime,image/jpeg,image/png,image/webp", id: "files" });
    var asCarousel = el("input", { type: "checkbox", id: "asCarousel" });
    var drafts = el("div", { class: "rows" }), pending = [];
    var sendBtn = el("button", { class: "btn", type: "button", text: "Enviar para a fila do cliente", disabled: true });
    function addDraft(fileList, revisionOf) {
      var list = Array.prototype.slice.call(fileList);
